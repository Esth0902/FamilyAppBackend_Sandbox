[variables]
NIXPACKS_PHP_ROOT_DIR="/app/public"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nginx"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "mkdir -p /var/log/nginx && touch /var/log/nginx/access.log /var/log/nginx/error.log && nginx -g 'daemon off;'"