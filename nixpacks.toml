[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nginx", "nodejs_22", "python311Packages.supervisor"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "mkdir -p /etc/supervisor/conf.d",
  "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
  "cp /assets/supervisord.conf /etc/supervisord.conf",
  "chmod +x /assets/start.sh"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
set -e

mkdir -p /var/log /var/log/nginx
touch /var/log/nginx-access.log \
      /var/log/nginx-error.log \
      /var/log/worker-nginx.log \
      /var/log/worker-phpfpm.log \
      /var/log/supervisord.log \
      /var/log/worker-reverb.log \
      /var/log/worker-queue.log \
      /var/log/worker-schedule.log

node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=true
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-reverb.conf" = '''
[program:worker-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/worker-reverb.log
stderr_logfile=/var/log/worker-reverb.log
'''

"worker-queue.conf" = '''
[program:worker-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/worker-queue.log
stderr_logfile=/var/log/worker-queue.log
'''

"worker-schedule.conf" = '''
[program:worker-schedule]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan schedule:work
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/worker-schedule.log
stderr_logfile=/var/log/worker-schedule.log
'''

"php-fpm.conf" = '''
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /nix/store/*-nginx-*/conf/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx-access.log;
    error_log  /var/log/nginx-error.log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;
        root ${NIXPACKS_PHP_ROOT_DIR};
        index index.php index.html;

        location / {
            try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include /nix/store/*-nginx-*/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''