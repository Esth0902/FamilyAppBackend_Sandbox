[variables]
NIXPACKS_PHP_ROOT_DIR="/app/public"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nginx", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && (php-fpm -D) && nginx -g 'daemon off;'"